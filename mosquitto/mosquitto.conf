# Mosquitto-Konfiguration für die Labor-Demo
# ACHTUNG: Ohne Passwort und ohne TLS – nur für den Laborbetrieb geeignet!

# Auf allen Netzwerk-Interfaces lauschen (sonst nur localhost im Container)
listener 1883
allow_anonymous true

# Retained Messages überleben einen Neustart des Brokers
persistence true
persistence_location /mosquitto/data/

# Logs direkt ausgeben -> sichtbar mit "docker compose logs mqtt-broker"
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
