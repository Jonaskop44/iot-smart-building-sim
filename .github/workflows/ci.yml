name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -v

  deploy:
    needs: test
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - run: Copy-Item .env.example .env -Force

      - name: Container bauen und starten
        run: docker compose up -d --build

      - name: Alle Geräte und der Controller melden "online"
        run: |
          Start-Sleep -Seconds 5
          $status = docker exec mqtt-broker mosquitto_sub -v -W 3 -t 'building/sensors/+/+/+/status' -t 'building/controller/status'
          $status | Write-Host
          $online = @($status | Select-String ' online$').Count
          if ($online -ne 5) { Write-Error "Erwartet 5 x online, gefunden: $online"; exit 1 }

      - name: Hitzealarm -> Klimaanlage schaltet ein
        run: |
          docker compose stop sensor-serverraum
          docker exec mqtt-broker mosquitto_pub -t building/sensors/zigbee/serverraum/temperature/data -m 35
          Start-Sleep -Seconds 1
          $state = docker exec mqtt-broker mosquitto_sub -C 1 -W 3 -t building/actuators/serverraum/klimaanlage/state
          $state | Write-Host
          if (-not ($state | Select-String -SimpleMatch '"state": "ON"')) { Write-Error "Klimaanlage ist nicht ON"; exit 1 }

      - name: Logs anzeigen
        if: always()
        run: docker compose logs

      - name: Aufräumen
        if: always()
        run: docker compose down
