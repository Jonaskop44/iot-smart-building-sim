name: CI/CD

on:
  push:
  pull_request:

jobs:
  # Stufe 1: Unit-Tests ausführen (ohne Broker)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -v

  # Stufe 2: Nur wenn Stufe 1 grün ist -> Container bauen, starten und prüfen
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env

      - name: Container bauen und starten
        run: docker compose up -d --build

      - name: Alle Geräte und der Controller melden "online"
        run: |
          sleep 5
          docker exec mqtt-broker mosquitto_sub -v -W 3 \
            -t 'building/sensors/+/+/+/status' -t 'building/controller/status' | tee status.txt || true
          test "$(grep -c ' online$' status.txt)" -eq 5

      - name: Hitzealarm -> Klimaanlage schaltet ein
        run: |
          docker compose stop sensor-serverraum
          docker exec mqtt-broker mosquitto_pub -t building/sensors/zigbee/serverraum/temperature/data -m 35
          sleep 1
          docker exec mqtt-broker mosquitto_sub -C 1 -W 3 \
            -t building/actuators/serverraum/klimaanlage/state | tee state.txt
          grep '"state": "ON"' state.txt

      - name: Logs anzeigen
        if: always()
        run: docker compose logs

      - name: Aufräumen
        if: always()
        run: docker compose down
