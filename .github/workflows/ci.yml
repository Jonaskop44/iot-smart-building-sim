name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -v

  deploy:
    needs: test
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v5
      - run: Copy-Item .env.example .env -Force

      - name: Container bauen und starten
        run: docker compose up -d --build
